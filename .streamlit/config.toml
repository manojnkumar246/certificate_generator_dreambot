[theme]
primaryColor = "#1a1a2e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#1e293b"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200

[logger]
level = "info"

[browser]
gatherUsageStats = false
